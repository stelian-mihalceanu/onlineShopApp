<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/common :: layout(~{::title}, ~{::main})}">
<head><title>Checkout - OnlineShop</title></head>
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3">Checkout</h1>
                    <p class="text-muted">Review your cart and place your order.</p>
                    <div class="alert alert-info">Payment is not connected in this MVP. Placing the order reserves inventory and clears your cart.</div>
                    <form th:action="@{/checkout}" method="post">
                        <button class="btn btn-primary" type="submit">Place order</button>
                        <a class="btn btn-outline-secondary ms-2" th:href="@{/cart}">Back to cart</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
