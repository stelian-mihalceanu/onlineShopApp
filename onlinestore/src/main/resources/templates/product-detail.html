<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/common :: layout(~{::title}, ~{::main})}">
<head><title>Product - OnlineShop</title></head>
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <span class="badge text-bg-light mb-3" th:if="${product.stock > 0}">In stock</span>
                    <span class="badge text-bg-secondary mb-3" th:unless="${product.stock > 0}">Out of stock</span>
                    <h1 class="h2" th:text="${product.name}">Product Name</h1>
                    <p class="text-muted" th:text="${product.description}">Description</p>
                    <div class="fs-3 fw-semibold mb-2" th:text="|$${product.price}|">$0.00</div>
                    <p class="text-muted" th:text="|${product.stock} available|">0 available</p>
                    <form th:action="@{/cart/add}" method="post" class="row g-2 align-items-end" th:if="${product.stock > 0}">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <div class="col-auto">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input id="quantity" name="quantity" type="number" class="form-control" min="1" th:max="${product.stock}" value="1" required>
                        </div>
                        <div class="col-auto"><button type="submit" class="btn btn-primary">Add to cart</button></div>
                    </form>
                    <a th:href="@{/products}" class="btn btn-outline-secondary mt-3">Back to products</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
