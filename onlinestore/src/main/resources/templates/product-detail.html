<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/common :: layout(~{::title}, ~{::main})}">
<head>
    <title>Product Detail - OnlineShop</title>
</head>
<body>
<main>
    <h1 th:text="${product.name}">Product Name</h1>
    <p th:text="${product.description}">Description</p>
    <p><strong>Price: </strong><span th:text="${product.price}">0.00</span></p>

    <form th:action="@{/cart/add}" method="post" class="mt-3">
        <input type="hidden" name="productId" th:value="${product.id}"/>
        <button type="submit" class="btn btn-success">Add to Cart</button>
        <a th:href="@{/products}" class="btn btn-secondary ms-2">Back to Products</a>
    </form>
</main>
</body>
</html>
