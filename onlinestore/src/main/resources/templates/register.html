<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/common :: layout(~{::title}, ~{::main})}">
<head>
    <title>Register - OnlineShop</title>
</head>
<body>
<main class="auth-page">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 mb-2">Create your account</h1>
                    <p class="text-muted mb-4">Join OnlineShop and start shopping.</p>
                    <form th:action="@{/register}" th:object="${user}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" th:field="*{username}" required minlength="3" maxlength="100" autocomplete="username">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}" required minlength="8" autocomplete="new-password">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create account</button>
                    </form>
                    <p class="mt-4 mb-0 text-center text-muted">
                        Already have an account? <a th:href="@{/login}">Sign in</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
